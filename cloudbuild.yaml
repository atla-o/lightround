# Optional Cloud Build trigger (image build). Primary path is GitHub Actions
# on push to main (`gcloud run deploy --source .`).
# Do not pass --allow-unauthenticated (org policy blocks allUsers). Public
# access is invoker_iam_disabled (--no-invoker-iam-check).
#
# Artifact Registry repo `cloud-run-source-deploy` is created by the first
# `gcloud run deploy --source` (or create it in us-west1 beforehand).
substitutions:
  _SERVICE: lightround-web
  _REGION: us-west1
  _AR_REPO: cloud-run-source-deploy

steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/${_SERVICE}:${COMMIT_SHA}
      - .

  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/${_SERVICE}:${COMMIT_SHA}

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - --image=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/${_SERVICE}:${COMMIT_SHA}
      - --region=${_REGION}
      - --project=${PROJECT_ID}
      - --no-invoker-iam-check
      - --quiet

images:
  - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/${_SERVICE}:${COMMIT_SHA}

timeout: 1200s
options:
  logging: CLOUD_LOGGING_ONLY
