# One-off: map humanehealth.devoutshaman.com onto Cloud Run humanehealth-web
# and add the DNS-only CNAME in the devoutshaman.com Cloudflare zone.
name: Map humanehealth domain

on:
  pull_request:

permissions:
  contents: read
  id-token: write

jobs:
  map:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      CLOUDFLARE_TOKEN: ${{ secrets.CLOUDFLARE_TOKEN }}
      CF_TOKEN: ${{ secrets.CF_TOKEN }}
      CLOUDFLARE_API_KEY: ${{ secrets.CLOUDFLARE_API_KEY }}
    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          project_id: devo-holding
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Map the domain and publish DNS
        run: |
          set +e
          gcloud components install beta --quiet
          echo "beta_install_exit:$?"

          echo "===== acashi mapping ====="
          gcloud beta run domain-mappings describe \
            --domain=acashi.devoutshaman.com \
            --region=us-west1 \
            --project=devo-holding \
            --format=yaml
          echo "acashi_describe_exit:$?"

          echo "===== create humanehealth mapping ====="
          gcloud beta run domain-mappings describe \
            --domain=humanehealth.devoutshaman.com \
            --region=us-west1 \
            --project=devo-holding \
            --format=yaml
          if [ $? -ne 0 ]; then
            gcloud beta run domain-mappings create \
              --service=humanehealth-web \
              --domain=humanehealth.devoutshaman.com \
              --region=us-west1 \
              --project=devo-holding \
              --quiet
            echo "create_exit:$?"
            gcloud beta run domain-mappings describe \
              --domain=humanehealth.devoutshaman.com \
              --region=us-west1 \
              --project=devo-holding \
              --format=yaml
          fi

          python3 - <<'PY'
          import os
          names = [
            "CLOUDFLARE_API_TOKEN","CF_API_TOKEN","CLOUDFLARE_TOKEN",
            "CF_TOKEN","CLOUDFLARE_API_KEY",
          ]
          for name in names:
              val = os.environ.get(name) or ""
              print(f"{name}={'set' if val else 'missing'} len={len(val)}")
          PY

          token="${CLOUDFLARE_API_TOKEN:-${CF_API_TOKEN:-${CLOUDFLARE_TOKEN:-${CF_TOKEN:-${CLOUDFLARE_API_KEY:-}}}}}"
          if [ -z "$token" ]; then
            echo "NO_CLOUDFLARE_TOKEN"
            exit 1
          fi
          echo "CLOUDFLARE_TOKEN_PRESENT"
          zone_json="$(curl -sS -H "Authorization: Bearer $token" \
            "https://api.cloudflare.com/client/v4/zones?name=devoutshaman.com")"
          python3 -c 'import json,os,sys; d=json.loads(os.environ["Z"]); print("zone_success", d.get("success"), "errors", d.get("errors")); r=d.get("result") or []; print("zones", len(r));
print("zone_id", r[0]["id"] if r else "")' 
          Z="$zone_json" python3 - <<'PY'
          import json, os
          d = json.loads(os.environ["Z"])
          print("zone_success", d.get("success"), "errors", d.get("errors"))
          result = d.get("result") or []
          print("zones", len(result))
          if not result:
              raise SystemExit(1)
          open("/tmp/zone_id","w").write(result[0]["id"])
          PY
          zone_id="$(cat /tmp/zone_id)"
          echo "zone_id_len=${#zone_id}"

          existing="$(curl -sS -H "Authorization: Bearer $token" \
            "https://api.cloudflare.com/client/v4/zones/$zone_id/dns_records?type=CNAME&name=humanehealth.devoutshaman.com")"
          Z="$existing" python3 - <<'PY'
          import json, os
          d = json.loads(os.environ["Z"])
          rows = d.get("result") or []
          print("existing", len(rows), "success", d.get("success"))
          open("/tmp/record_id","w").write(rows[0]["id"] if rows else "")
          PY
          record_id="$(cat /tmp/record_id)"
          body='{"type":"CNAME","name":"humanehealth","content":"ghs.googlehosted.com","proxied":false,"ttl":1}'
          if [ -n "$record_id" ]; then
            resp="$(curl -sS -X PUT -H "Authorization: Bearer $token" -H 'Content-Type: application/json' \
              "https://api.cloudflare.com/client/v4/zones/$zone_id/dns_records/$record_id" --data "$body")"
          else
            resp="$(curl -sS -X POST -H "Authorization: Bearer $token" -H 'Content-Type: application/json' \
              "https://api.cloudflare.com/client/v4/zones/$zone_id/dns_records" --data "$body")"
          fi
          Z="$resp" python3 - <<'PY'
          import json, os, sys
          d = json.loads(os.environ["Z"])
          result = d.get("result") or {}
          print("dns_success", d.get("success"))
          print("errors", d.get("errors"))
          print("name", result.get("name"), "content", result.get("content"), "proxied", result.get("proxied"))
          if not d.get("success"):
              sys.exit(1)
          PY
