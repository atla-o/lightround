# Push to main deploys Cloud Run service lightround-web (devo-holding, us-west1).
# Public access: invoker IAM disabled. Never --allow-unauthenticated (org policy
# blocks allUsers). Requires repo variables GCP_WORKLOAD_IDENTITY_PROVIDER and
# GCP_SERVICE_ACCOUNT. See README.md.
name: Deploy lightround-web

on:
  push:
    branches: [main]

concurrency:
  group: deploy-lightround-web
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy lightround-web \
            --source . \
            --project=devo-holding \
            --region=us-west1 \
            --no-invoker-iam-check \
            --quiet
