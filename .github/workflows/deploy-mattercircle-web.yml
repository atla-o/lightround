# Puts STRIPE_SECRET_KEY on mattercircle-web from a one-time private upload.
# The key is not stored in this repo.
name: Deploy mattercircle-web

on:
  push:
    branches: [cursor/deploy-mattercircle-web-e8a3]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  issues: write

jobs:
  stripe-key:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          project_id: devo-holding
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Open a private upload slot
        id: slot
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bucket="devo-holding-mc-stripe-inbox"
          object="incoming/${GITHUB_RUN_ID}"
          token="$(gcloud auth print-access-token)"
          code="$(curl -sS -D /tmp/upload-headers -o /tmp/start-body -w '%{http_code}' -X POST \
            -H "Authorization: Bearer ${token}" \
            -H "Content-Type: application/octet-stream" \
            -H "x-goog-resumable: start" \
            "https://storage.googleapis.com/upload/storage/v1/b/${bucket}/o?uploadType=resumable&name=${object}")"
          unset token
          echo "start_http=${code}"
          if [ "${code}" != "200" ]; then
            python3 -c 'from pathlib import Path; print(Path("/tmp/start-body").read_text()[:400])'
            exit 1
          fi
          python3 - <<'PY'
          from pathlib import Path
          loc = ""
          for line in Path("/tmp/upload-headers").read_text().splitlines():
              if line.lower().startswith("location:"):
                  loc = line.split(":", 1)[1].strip()
          if not loc.startswith("https://"):
              raise SystemExit("missing upload location")
          Path("/tmp/upload-url.txt").write_text(loc)
          PY
          issue="$(gh api repos/atla-o/lightround/issues -f title="stripe-inbox-${GITHUB_RUN_ID}" -f body="$(cat /tmp/upload-url.txt)" --jq .number)"
          echo "opened_issue=${issue}"
          echo "bucket=${bucket}" >> "$GITHUB_OUTPUT"
          echo "object=${object}" >> "$GITHUB_OUTPUT"
          echo "issue=${issue}" >> "$GITHUB_OUTPUT"
          rm -f /tmp/upload-url.txt

      - name: Apply the key when it arrives
        env:
          BUCKET: ${{ steps.slot.outputs.bucket }}
          OBJECT: ${{ steps.slot.outputs.object }}
          ISSUE: ${{ steps.slot.outputs.issue }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          found=0
          for _ in $(seq 1 36); do
            if gcloud storage cat "gs://${BUCKET}/${OBJECT}" --project=devo-holding > /tmp/stripe-key 2>/dev/null; then
              found=1
              break
            fi
            sleep 5
          done
          gh api -X PATCH "repos/atla-o/lightround/issues/${ISSUE}" -f body="used" -f state="closed" >/dev/null
          if [ "$found" != "1" ]; then
            echo "No key arrived"
            exit 1
          fi
          python3 - <<'PY'
          from pathlib import Path
          value = Path("/tmp/stripe-key").read_text().strip()
          if not value.startswith("rk_") or len(value) < 40:
              raise SystemExit("unexpected key shape")
          Path("/tmp/stripe-key").write_text(value)
          print("key_length", len(value))
          PY
          gcloud run services update mattercircle-web \
            --project=devo-holding \
            --region=us-west1 \
            --update-env-vars="^@^STRIPE_SECRET_KEY=$(cat /tmp/stripe-key)" \
            --format="value(status.url)" \
            --quiet > /tmp/service-url.txt 2>/tmp/update-err.txt || {
              if grep -q 'rk_' /tmp/update-err.txt; then
                echo "update failed; details redacted"
              else
                cat /tmp/update-err.txt
              fi
              exit 1
            }
          if grep -q 'rk_' /tmp/update-err.txt; then
            echo "update stderr redacted"
          else
            cat /tmp/update-err.txt
          fi
          echo "service_url=$(cat /tmp/service-url.txt)"
          gcloud storage rm "gs://${BUCKET}/${OBJECT}" --project=devo-holding
          shred -u /tmp/stripe-key || rm -f /tmp/stripe-key
