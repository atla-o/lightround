# Authorize devoutshaman.com for the deploy account, then confirm the mapping.
# Does not change DNS and does not rebuild.
name: Map mattercircle domain

on:
  pull_request:

permissions:
  contents: read
  id-token: write

jobs:
  map:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          project_id: devo-holding
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Verify the parent domain for this account
        run: |
          set -u
          token="$(gcloud auth print-access-token)"
          body='{"site":{"type":"INET_DOMAIN","identifier":"devoutshaman.com"}}'
          code="$(curl -sS -o /tmp/verify.json -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $token" \
            -H 'Content-Type: application/json' \
            "https://www.googleapis.com/siteVerification/v1/webResource?verificationMethod=DNS_TXT" \
            --data "$body")"
          echo "verify_http=$code"
          python3 - <<'PY'
          import json
          d = json.load(open("/tmp/verify.json"))
          err = d.get("error") or {}
          print("error_code", err.get("code"))
          msg = err.get("message") or ""
          print("error_message", msg[:300])
          site = d.get("site") or {}
          print("site", site.get("type"), site.get("identifier"))
          owners = d.get("owners") or []
          print("owners", len(owners))
          PY
