# Authorize devoutshaman.com for the deploy account using the existing TXT.
# Does not change DNS and does not rebuild.
name: Map mattercircle domain

on:
  pull_request:

permissions:
  contents: read
  id-token: write

jobs:
  map:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          project_id: devo-holding
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
          access_token_scopes: https://www.googleapis.com/auth/cloud-platform,https://www.googleapis.com/auth/siteverification

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Verify the parent domain for this account
        run: |
          set -u
          token="$(gcloud auth print-access-token)"
          body='{"site":{"type":"INET_DOMAIN","identifier":"devoutshaman.com"},"verificationMethod":"DNS_TXT"}'
          code="$(curl -sS -o /tmp/token.json -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $token" \
            -H 'Content-Type: application/json' \
            "https://www.googleapis.com/siteVerification/v1/token" \
            --data "$body")"
          echo "token_http=$code"
          python3 - <<'PY'
          import json, subprocess
          d = json.load(open("/tmp/token.json"))
          err = d.get("error") or {}
          print("token_error", err.get("code"), (err.get("message") or "")[:200])
          issued = d.get("token") or ""
          txt = subprocess.check_output(["dig","+short","devoutshaman.com","TXT"], text=True)
          print("issued_len", len(issued))
          print("matches_existing_txt", bool(issued) and issued in txt)
          PY
          vcode="$(curl -sS -o /tmp/verify.json -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $token" \
            -H 'Content-Type: application/json' \
            "https://www.googleapis.com/siteVerification/v1/webResource?verificationMethod=DNS_TXT" \
            --data '{"site":{"type":"INET_DOMAIN","identifier":"devoutshaman.com"}}')"
          echo "verify_http=$vcode"
          python3 - <<'PY'
          import json
          d = json.load(open("/tmp/verify.json"))
          err = d.get("error") or {}
          print("verify_error", err.get("code"), (err.get("message") or "")[:300])
          site = d.get("site") or {}
          print("site", site.get("type"), site.get("identifier"))
          PY
