# Map mattercircle.devoutshaman.com onto the existing Cloud Run service.
# Same project, region, and mapping shape as phenomatch.devoutshaman.com.
# Does not deploy, rebuild, or change DNS.
name: Map mattercircle domain

on:
  pull_request:

permissions:
  contents: read
  id-token: write

jobs:
  map:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          project_id: devo-holding
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Create the domain mapping
        run: |
          set -u
          gcloud components install beta --quiet
          echo "===== phenomatch mapping ====="
          gcloud beta run domain-mappings describe \
            --domain=phenomatch.devoutshaman.com \
            --region=us-west1 \
            --project=devo-holding \
            --format="yaml(spec,status.resourceRecords,status.conditions)"
          echo "===== mattercircle mapping ====="
          if ! gcloud beta run domain-mappings describe \
            --domain=mattercircle.devoutshaman.com \
            --region=us-west1 \
            --project=devo-holding >/dev/null 2>&1; then
            gcloud beta run domain-mappings create \
              --service=mattercircle-web \
              --domain=mattercircle.devoutshaman.com \
              --region=us-west1 \
              --project=devo-holding \
              --quiet
          else
            echo "mapping already exists"
          fi
          gcloud beta run domain-mappings describe \
            --domain=mattercircle.devoutshaman.com \
            --region=us-west1 \
            --project=devo-holding \
            --format=yaml
