# Read the Mattercircle Cloud Run domain mapping. Does not deploy or change DNS.
name: Map mattercircle domain

on:
  pull_request:

permissions:
  contents: read
  id-token: write

jobs:
  map:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          project_id: devo-holding
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Describe the domain mapping
        run: |
          set -u
          token="$(gcloud auth print-access-token)"
          curl -sS -H "Authorization: Bearer $token" \
            "https://run.googleapis.com/v1/projects/devo-holding/locations/us-west1/domainmappings/mattercircle.devoutshaman.com" \
            -o /tmp/mapping.json
          python3 -m json.tool /tmp/mapping.json
